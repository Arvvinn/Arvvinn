name: Refresh profile widgets

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Render public statistics
        run: python scripts/build_profile.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions.svg?color_snake=%237c3aed&color_dots=%23ebedf0,%23c4b5fd,%23a78bfa,%238b5cf6,%236d28d9
            assets/contributions-dark.svg?palette=github-dark&color_snake=%2367e8f9&color_dots=%23161b22,%23164056,%23155e75,%230e7490,%2322d3ee
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit refreshed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if git diff --cached --quiet; then
            echo 'Widgets already up to date.'
          else
            git commit -m 'chore: refresh profile widgets'
            git push
          fi
